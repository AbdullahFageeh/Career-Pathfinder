name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Trigger production deployment webhook
        id: deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL secret is not configured." >&2
            exit 1
          fi

          curl --fail --show-error --silent -X POST "$DEPLOY_WEBHOOK_URL"

          if [ -n "$PRODUCTION_URL" ]; then
            echo "production_url=$PRODUCTION_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify production readiness
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          HEALTH_URL="${PRODUCTION_URL%/}/health"
          echo "Polling $HEALTH_URL for readiness..."

          for attempt in $(seq 1 30); do
            STATUS_CODE="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$HEALTH_URL" || true)"

            if [ "$STATUS_CODE" = "200" ]; then
              echo "Production health check passed."
              cat /tmp/health.json || true
              exit 0
            fi

            echo "Attempt $attempt/30 returned HTTP $STATUS_CODE. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Production health check did not pass in time." >&2
          exit 1
