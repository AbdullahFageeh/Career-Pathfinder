name: Daily job desk

on:
  schedule:
    # 09:00 Asia/Riyadh (06:00 UTC), Monday through Friday.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-job-desk
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover, prepare and report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Write private profile and automation settings
        env:
          APPLICATION_REFERENCE_MD: ${{ secrets.APPLICATION_REFERENCE_MD }}
          AUTOMATION_CONFIG_JSON: ${{ secrets.AUTOMATION_CONFIG_JSON }}
        run: |
          if [ -z "$APPLICATION_REFERENCE_MD" ] || [ -z "$AUTOMATION_CONFIG_JSON" ]; then
            echo "Add APPLICATION_REFERENCE_MD and AUTOMATION_CONFIG_JSON repository secrets before enabling this workflow." >&2
            exit 1
          fi
          printf '%s' "$APPLICATION_REFERENCE_MD" > APPLICATION_REFERENCE.md
          printf '%s' "$AUTOMATION_CONFIG_JSON" > automation.config.json

      - name: Enforce observe-only scheduled mode
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const config = JSON.parse(await readFile("automation.config.json", "utf8"));
          if (config.automationMode !== "observe" || config.autoSubmitEnabled !== false) {
            throw new Error("The scheduled job desk only runs with automationMode=observe and autoSubmitEnabled=false.");
          }
          NODE

      - name: Check project
        run: npm run check

      - name: Prepare private runtime directories
        run: mkdir -p data artifacts/review

      - name: Restore encrypted pipeline state
        uses: actions/cache/restore@v4
        with:
          path: .pipeline-state/pipeline-store.sqlite.enc
          key: daily-job-desk-private-state-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            daily-job-desk-private-state-v2-${{ github.ref_name }}-

      - name: Decrypt pipeline state when configured
        env:
          PIPELINE_STATE_KEY: ${{ secrets.PIPELINE_STATE_KEY }}
        run: |
          if [ -z "$PIPELINE_STATE_KEY" ]; then
            echo "PIPELINE_STATE_KEY is not configured; this run starts with empty pipeline state."
            exit 0
          fi
          if [ -s .pipeline-state/pipeline-store.sqlite.enc ]; then
            node scripts/secure_pipeline_state.mjs decrypt .pipeline-state/pipeline-store.sqlite.enc data/pipeline-store.sqlite
          else
            echo "No previous encrypted pipeline state found; starting fresh."
          fi

      - name: Run the daily discovery desk
        run: npm run automation:run -- --config ./automation.config.json --reference-path ./APPLICATION_REFERENCE.md --storage-path ./data/pipeline-store.sqlite --output ./artifacts/automation-review.md

      - name: Prepare queued roles
        run: |
          set -o pipefail
          npm run worker:once -- --storage-path ./data/pipeline-store.sqlite --max-jobs 30 | tee artifacts/worker-report.txt

      - name: Generate review packets
        run: npm run review:packets -- --storage-path ./data/pipeline-store.sqlite --reference-path ./APPLICATION_REFERENCE.md --output-dir ./artifacts/review --formats html

      - name: Write follow-ups and funnel report
        run: |
          npm run followups -- --storage-path ./data/pipeline-store.sqlite --reference-path ./APPLICATION_REFERENCE.md --output ./artifacts/followups.md
          npm run report -- --storage-path ./data/pipeline-store.sqlite --output ./artifacts/funnel-report.md

      - name: Encrypt private review packets
        if: always()
        env:
          PIPELINE_STATE_KEY: ${{ secrets.PIPELINE_STATE_KEY_NEXT || secrets.PIPELINE_STATE_KEY }}
        run: |
          if [ -z "$PIPELINE_STATE_KEY" ]; then
            echo "PIPELINE_STATE_KEY is not configured; private review packets will not be uploaded."
            exit 0
          fi
          if [ -n "$(find artifacts/review -type f -print -quit 2>/dev/null)" ]; then
            tar -czf .pipeline-state/review-packets.tar.gz -C artifacts/review .
            node scripts/secure_pipeline_state.mjs encrypt-file .pipeline-state/review-packets.tar.gz .pipeline-state/review-packets.tar.gz.enc
          else
            echo "No review packets were generated."
          fi

      - name: Encrypt pipeline state when configured
        if: always()
        env:
          PIPELINE_STATE_KEY: ${{ secrets.PIPELINE_STATE_KEY_NEXT || secrets.PIPELINE_STATE_KEY }}
        run: |
          if [ -z "$PIPELINE_STATE_KEY" ]; then
            echo "PIPELINE_STATE_KEY is not configured; pipeline state will not persist between runs."
            exit 0
          fi
          if [ -s data/pipeline-store.sqlite ]; then
            node scripts/secure_pipeline_state.mjs encrypt data/pipeline-store.sqlite .pipeline-state/pipeline-store.sqlite.enc
          else
            echo "No pipeline database was produced; nothing to persist."
          fi

      - name: Save encrypted pipeline state
        if: always() && hashFiles('.pipeline-state/pipeline-store.sqlite.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .pipeline-state/pipeline-store.sqlite.enc
          key: daily-job-desk-private-state-v2-${{ github.ref_name }}-${{ github.run_id }}

      - name: Add a small run summary
        if: always()
        run: |
          {
            echo "## Daily job desk"
            echo ""
            echo "Run: `${GITHUB_RUN_NUMBER}`"
            echo "Commit: `${GITHUB_SHA}`"
            if [ -f artifacts/automation-review.md ]; then
              echo ""
              echo "The full safe summary is available in the workflow artifact."
              sed -n '/## Run summary/,/## Queued for preparation/p' artifacts/automation-review.md | head -20
            else
              echo "The desk did not produce a summary; inspect the failed step above."
            fi
            if [ -f artifacts/worker-report.txt ]; then
              echo ""
              echo "Worker result:"
              tail -8 artifacts/worker-report.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily desk output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-job-desk-${{ github.run_number }}
          path: |
            artifacts/automation-review.md
            artifacts/worker-report.txt
            artifacts/followups.md
            artifacts/funnel-report.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload encrypted private review packets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-review-packets-${{ github.run_number }}
          path: .pipeline-state/review-packets.tar.gz.enc
          if-no-files-found: ignore
          retention-days: 7
