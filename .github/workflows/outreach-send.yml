name: Automated Gmail outreach

on:
  schedule:
    # 10:00 Asia/Riyadh (07:00 UTC), Sunday through Thursday.
    - cron: "0 7 * * 0-4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automated-gmail-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore outreach state
        uses: actions/cache/restore@v4
        with:
          path: .cloud-state/state.json
          key: outreach-state-${{ github.run_id }}
          restore-keys: outreach-state-

      - name: Seed existing outreach history
        run: |
          mkdir -p .cloud-state
          if [ ! -s .cloud-state/state.json ]; then
            cp outreach/state_seed.json .cloud-state/state.json
          fi

      - name: Prepare private files
        env:
          APPLICATION_REFERENCE_MD: ${{ secrets.APPLICATION_REFERENCE_MD }}
          CV_PDF_BASE64: ${{ secrets.CV_PDF_BASE64 }}
        run: |
          test -n "$APPLICATION_REFERENCE_MD" || (echo "Missing APPLICATION_REFERENCE_MD secret" >&2; exit 1)
          test -n "$CV_PDF_BASE64" || (echo "Missing CV_PDF_BASE64 secret" >&2; exit 1)
          mkdir -p .cloud-state /tmp/abdullah-outreach
          printf '%s' "$APPLICATION_REFERENCE_MD" > /tmp/abdullah-outreach/APPLICATION_REFERENCE.md
          printf '%s' "$CV_PDF_BASE64" | base64 --decode > /tmp/abdullah-outreach/cv.pdf
          sed -i "s#^\- Master CV PDF:.*#- Master CV PDF: /tmp/abdullah-outreach/cv.pdf#" /tmp/abdullah-outreach/APPLICATION_REFERENCE.md
          test -s /tmp/abdullah-outreach/cv.pdf || (echo "CV_PDF_BASE64 decoded to an empty file" >&2; exit 1)

      - name: Prepare queued emails
        run: python3 outreach/prepare_outreach.py prepare --limit 50 --state .cloud-state/state.json --profile /tmp/abdullah-outreach/APPLICATION_REFERENCE.md --email-dir /tmp/abdullah-outreach/email-drafts --message-dir /tmp/abdullah-outreach/messages --dashboard /tmp/abdullah-outreach/review_queue.md

      - name: Send up to 10 emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 outreach/cloud_send_email.py --limit 10 --daily-cap 10 --state .cloud-state/state.json --profile /tmp/abdullah-outreach/APPLICATION_REFERENCE.md

      - name: Prepare due follow-ups
        run: python3 outreach/prepare_outreach.py followups --state .cloud-state/state.json --profile /tmp/abdullah-outreach/APPLICATION_REFERENCE.md

      - name: Send due follow-ups within the same daily cap
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 outreach/cloud_send_followups.py --limit 10 --daily-cap 10 --state .cloud-state/state.json --targets outreach/targets.csv --profile /tmp/abdullah-outreach/APPLICATION_REFERENCE.md

      - name: Save outreach state
        uses: actions/cache/save@v4
        with:
          path: .cloud-state/state.json
          key: outreach-state-${{ github.run_id }}

      - name: Upload run report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-run-${{ github.run_number }}
          path: /tmp/abdullah-outreach/review_queue.md
          if-no-files-found: ignore
          retention-days: 14
